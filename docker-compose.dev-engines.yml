# Dev OLTP engines for local CDC / type-coercion testing (host network).
# Usage: docker compose -f docker-compose.dev-engines.yml up -d
# See Obsidian: Dev Testing MSSQL.md, Dev Testing MongoDB.md

name: datasync-dev-engines

services:
  mssql-test:
    container_name: datasync-mssql-test
    image: mcr.microsoft.com/mssql/server:2022-latest
    network_mode: host
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DataSync_Dev1!}"
      MSSQL_PID: Developer
    volumes:
      - datasync-mssql-test-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  mongodb-test:
    container_name: datasync-mongodb-test
    image: mongo:7
    network_mode: host
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - datasync-mongodb-test-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s

volumes:
  datasync-mssql-test-data:
  datasync-mongodb-test-data:
