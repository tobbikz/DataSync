# Dev OLTP + catalog/lake PG for local CDC / smoke testing (host network).
# Usage: docker compose -f docker-compose.dev-engines.yml up -d
# Then: tools/start-dev-engines.sh  |  tools/bootstrap-dev-engines.sh
# Windows: use Git Bash; smokes expect container names below.

name: datasync-dev-engines

services:
  postgres-lab:
    container_name: datasync-postgres-lab
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: datasync
      POSTGRES_PASSWORD: DataSync_Dev1!
      POSTGRES_DB: postgres
    volumes:
      - datasync-postgres-lab-data:/var/lib/postgresql/data
      - ./tools/dev-postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasync -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mariadb-test:
    container_name: datasync-mariadb-test
    image: mariadb:11
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: DataSync_Dev1!
      MARIADB_DATABASE: testdb
    volumes:
      - datasync-mariadb-test-data:/var/lib/mysql
      - ./tools/mariadb-dev-cdc.cnf:/etc/mysql/conf.d/datasync-cdc.cnf:ro
      - ./tools/dev-mariadb/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  mssql-test:
    container_name: datasync-mssql-test
    image: mcr.microsoft.com/mssql/server:2022-latest
    network_mode: host
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DataSync_Dev1!}"
      MSSQL_PID: Developer
    volumes:
      - datasync-mssql-test-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  mongodb-test:
    container_name: datasync-mongodb-test
    image: mongo:7
    network_mode: host
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - datasync-mongodb-test-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s

volumes:
  datasync-postgres-lab-data:
  datasync-mariadb-test-data:
  datasync-mssql-test-data:
  datasync-mongodb-test-data:
