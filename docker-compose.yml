# DataSync — DataSync daemon only (Kafka = native systemd DataSync-kafka.service).
# Install: ./install.sh — external databases via config.json
#
# Kafka: deploy/kafka/install-kafka.sh → localhost:9092 (Apache KRaft, no Docker).
# datasync uses network_mode:host for PostgreSQL on Linux.

name: datasync

services:
  datasync:
    build:
      context: .
      dockerfile: Dockerfile
    image: datasync:local
    network_mode: host
    environment:
      DATASYNC_ROOT: /app
      DATASYNC_CONFIG: /app/config.json
      DATASYNC_RUN_MIGRATIONS: "0"
      DATASYNC_HOST_NETWORK: "1"
      KAFKA_BOOTSTRAP: localhost:9092
    volumes:
      - ./config.json:/app/config.json:ro
      - ./sql:/app/sql:ro
    restart: unless-stopped
    command: ["daemon"]
