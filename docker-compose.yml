# DataSync — Kafka + DataSync daemon only (no PG/MariaDB/MSSQL/Mongo).
# Install: ./install.sh — external databases via config.json
#
# All services use host networking (Linux) — avoids Podman/Docker Compose DNS
# issues where kafka cannot resolve hostname "zookeeper".

name: datasync

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    network_mode: host
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc -w 2 127.0.0.1 2181 | grep -q Mode"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    network_mode: host
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 127.0.0.1:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s

  datasync:
    build:
      context: .
      dockerfile: Dockerfile
    image: datasync:local
    network_mode: host
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DATASYNC_ROOT: /app
      DATASYNC_CONFIG: /app/config.json
      DATASYNC_RUN_MIGRATIONS: "0"
      DATASYNC_HOST_NETWORK: "1"
      KAFKA_BOOTSTRAP: localhost:9092
    volumes:
      - ./config.json:/app/config.json:ro
      - ./sql:/app/sql:ro
    restart: unless-stopped
    command: ["daemon"]
