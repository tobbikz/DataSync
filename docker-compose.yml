# DataSync — Kafka (KRaft, no Zookeeper) + DataSync daemon.
# Install: ./install.sh — external databases via config.json
#
# Kafka publishes 9092→host; datasync uses network_mode:host for PostgreSQL.
# KRaft avoids Podman Compose DNS / ZK host-network issues on RHEL.

name: datasync

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 90s

  datasync:
    build:
      context: .
      dockerfile: Dockerfile
    image: datasync:local
    network_mode: host
    environment:
      DATASYNC_ROOT: /app
      DATASYNC_CONFIG: /app/config.json
      DATASYNC_RUN_MIGRATIONS: "0"
      DATASYNC_HOST_NETWORK: "1"
      KAFKA_BOOTSTRAP: localhost:9092
    volumes:
      - ./config.json:/app/config.json:ro
      - ./sql:/app/sql:ro
    restart: unless-stopped
    command: ["daemon"]
