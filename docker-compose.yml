# DataSync — Kafka (KRaft) + CDC daemon + ops UI in one compose stack.
# Host: ./install.sh initial (first time) | start | stop
# host network: daemon reaches OLTP on host (MariaDB :3306, PG :5432, etc.)
# UI: http://127.0.0.1:3000  (DATASYNC_UI_USER / DATASYNC_UI_PASSWORD)
# No MariaDB/MSSQL/Mongo server containers — only Kafka + DataSync daemon + UI.
# on rootful Docker and rootless Podman (no rootlessport bridge gap).
# Kafka data: ./kafka-data (bind mount; install.sh creates it with mode 777). Migration:
# ./install.sh stop, copy kafka-data/ to the new host (same CLUSTER_ID below), ./install.sh start.
# Override path: DATASYNC_KAFKA_DATA.

name: datasync

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATASYNC_KAFKA_DATA:-./kafka-data}:/var/lib/kafka/data:z
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Large CDC payloads (align with pipeline_defaults kApplyMaxPartitionFetchBytes).
      KAFKA_MESSAGE_MAX_BYTES: "10485760"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
      # Log retention: 6h OR 128MB per partition (whichever first). 1GB/partition filled disks.
      KAFKA_LOG_RETENTION_MS: "21600000"
      KAFKA_LOG_RETENTION_BYTES: "134217728"
      KAFKA_LOG_SEGMENT_BYTES: "134217728"
      KAFKA_LOG_SEGMENT_MS: "86400000"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_CLEANER_ENABLE: "true"
      # Expire stale consumer group offsets (unrelated to log segments, frees __consumer_offsets).
      KAFKA_OFFSETS_RETENTION_MINUTES: "10080"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 90s

  datasync:
    build:
      context: .
      dockerfile: Dockerfile
    image: datasync:local
    network_mode: host
    environment:
      DATASYNC_ROOT: /app
      DATASYNC_CONFIG: /app/config.json
      DATASYNC_AUTO_DISCOVER: "0"
      DATASYNC_HOST_NETWORK: "1"
      KAFKA_BOOTSTRAP: 127.0.0.1:9092
    volumes:
      - ./config.json:/app/config.json:ro,z
    restart: unless-stopped
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    depends_on:
      kafka:
        condition: service_healthy
    command: ["daemon"]

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: datasync-ui:local
    network_mode: host
    restart: unless-stopped
    user: "${DATASYNC_UID:-1000}:${DATASYNC_GID:-1000}"
    environment:
      DATASYNC_ROOT: /stack
      DATASYNC_CONFIG: /stack/config.json
      DATASYNC_COMPOSE_FILE: /stack/docker-compose.yml
      DATASYNC_CONTAINER_CMD: ${DATASYNC_CONTAINER_CMD:-docker}
      DOCKER_HOST: ${DOCKER_HOST:-}
      KAFKA_BOOTSTRAP: 127.0.0.1:9092
      DATASYNC_UI_USER: ${DATASYNC_UI_USER:-admin}
      DATASYNC_UI_PASSWORD: ${DATASYNC_UI_PASSWORD:-datasync}
      DATASYNC_UI_SECRET: ${DATASYNC_UI_SECRET:-change-me-in-production}
      PORT: "3000"
      NODE_ENV: production
    volumes:
      - .:/stack:ro,z
      - ${DATASYNC_CONTAINER_BIN:-/usr/bin/false}:/usr/local/bin/container:ro,z
      - ${DATASYNC_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      - datasync
