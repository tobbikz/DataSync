# DataSync — Kafka (KRaft) + CDC daemon in one compose stack.
# Host: ./install.sh start  |  Systemd: DataSync.service → install.sh start/stop
# host network: daemon reaches OLTP on host (MariaDB :3306, PG :5432, etc.)
# No MariaDB/MSSQL/Mongo server containers — only Kafka + DataSync daemon.
# on rootful Docker and rootless Podman (no rootlessport bridge gap).
# Kafka data: ./kafka-data (bind mount; install.sh creates it with mode 777). Migration:
# ./install.sh stop, copy kafka-data/ to the new host (same CLUSTER_ID below), ./install.sh start.
# Override path: DATASYNC_KAFKA_DATA.

name: datasync

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATASYNC_KAFKA_DATA:-./kafka-data}:/var/lib/kafka/data:z
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Large CDC payloads (align with pipeline_defaults kApplyMaxPartitionFetchBytes).
      KAFKA_MESSAGE_MAX_BYTES: "10485760"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
      # Log retention: 3 days OR per-partition byte cap (whichever triggers first).
      # Without retention.bytes, high CDC volume can fill disk within the time window.
      KAFKA_LOG_RETENTION_MS: "259200000"
      KAFKA_LOG_RETENTION_BYTES: "1073741824"
      KAFKA_LOG_SEGMENT_BYTES: "134217728"
      KAFKA_LOG_SEGMENT_MS: "86400000"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_CLEANER_ENABLE: "true"
      # Expire stale consumer group offsets (unrelated to log segments, frees __consumer_offsets).
      KAFKA_OFFSETS_RETENTION_MINUTES: "10080"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 90s

  datasync:
    build:
      context: .
      dockerfile: Dockerfile
    image: datasync:local
    network_mode: host
    environment:
      DATASYNC_ROOT: /app
      DATASYNC_CONFIG: /app/config.json
      DATASYNC_RUN_MIGRATIONS: "0"
      DATASYNC_AUTO_DISCOVER: "0"
      DATASYNC_HOST_NETWORK: "1"
      KAFKA_BOOTSTRAP: 127.0.0.1:9092
    volumes:
      - ./config.json:/app/config.json:ro,z
    restart: unless-stopped
    stop_grace_period: 120s
    depends_on:
      kafka:
        condition: service_healthy
    command: ["daemon"]
